name: Feature request
description: Suggest a tool, prompt, resource or documentation improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: client
    attributes:
      label: Client you use
      options: [Claude, ChatGPT, Perplexity, Grok, Mistral, Microsoft Copilot, Claude Code, Cursor, VS Code, Codex, Custom agent, Other]
