name: Bug report
description: Something in the docs, examples or connector behavior is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post API keys, tokens or personal data. For security issues, email support@skrapp.io instead (see SECURITY.md).
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Claude, ChatGPT, Perplexity, Grok, Mistral, Microsoft Copilot, Claude Code, Cursor, VS Code, Codex, curl or custom agent, Other]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool, prompt or resource
      description: For example find_email or skrapp://pricing/tool-costs
  - type: input
    id: request_id
    attributes:
      label: Request ID (redacted)
      description: From the response or error, if shown. Remove anything that identifies a person or account.
  - type: input
    id: when
    attributes:
      label: Time of the call (UTC)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
